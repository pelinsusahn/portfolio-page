<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Normalization</title>
<style>
  :root {
    --font-ui: "Helvetica Neue", Helvetica, Arial, sans-serif;
    --font-mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
    --paper: #fbfaf7;
    --ink: #1b1b1a;
    --muted: #85847f;
    --rule: rgba(0,0,0,0.12);
    --anim: 3.9s;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
  }
  body {
    padding: 22px;
    display: grid;
    place-items: center;
  }
  .slide {
    width: min(1600px, 96vw);
    aspect-ratio: 16 / 9;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle at 18% 10%, rgba(0,0,0,0.022), transparent 22%),
      linear-gradient(180deg, rgba(255,255,255,0.72), rgba(255,255,255,0.4)),
      var(--paper);
    border: 1px solid rgba(0,0,0,0.06);
    box-shadow: 0 18px 60px rgba(0,0,0,0.05);
  }
  .frame {
    position: absolute;
    inset: 18px;
    border: 1px solid rgba(0,0,0,0.06);
    pointer-events: none;
  }
  .layout {
    position: absolute;
    inset: 34px 34px 76px;
    display: grid;
    grid-template-columns: 1fr 170px 1fr;
    gap: 24px;
    align-items: stretch;
  }
  .panel {
    position: relative;
    padding: 18px 18px 42px;
  }
  .panel-title {
    font-family: var(--font-ui);
    font-size: 15px;
    letter-spacing: 0.01em;
    color: var(--muted);
    margin-bottom: 8px;
    font-weight: 700;
    font-style: italic;
  }
  .plot-wrap {
    position: absolute;
    inset: 42px 6px 24px;
  }
  .plot-wrap svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .axis-line {
    stroke: rgba(0,0,0,0.55);
    stroke-width: 1.15;
  }
  .guide-line {
    stroke: rgba(0,0,0,0.07);
    stroke-width: 1;
  }
  .axis-text {
    fill: var(--muted);
    font-family: var(--font-mono);
    font-size: 10px;
  }
  .axis-label {
    fill: #686862;
    font-family: var(--font-ui);
    font-size: 11px;
    letter-spacing: 0.01em;
  }
  .group {
    opacity: 0;
    animation: revealGroup var(--anim) ease-out forwards;
  }
  .raw-group.moment { animation-delay: 0.12s; }
  .raw-group.braced { animation-delay: 0.28s; }
  .raw-group.core { animation-delay: 0.44s; }
  .raw-group.shear { animation-delay: 0.60s; }
  .norm-group.moment { animation-delay: 1.72s; }
  .norm-group.braced { animation-delay: 1.90s; }
  .norm-group.core { animation-delay: 2.08s; }
  .norm-group.shear { animation-delay: 2.26s; }
  .dot {
    opacity: 0.34;
  }
  .mid {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 18px;
  }
  .mid-copy {
    font-size: 15px;
    line-height: 1.15;
    letter-spacing: -0.02em;
    color: #55554f;
    opacity: 0;
    animation: midFade var(--anim) ease-out forwards;
    animation-delay: 0.98s;
  }
  .mid-arrow {
    width: 92px;
    height: 44px;
    opacity: 0;
    animation: midFade var(--anim) ease-out forwards;
    animation-delay: 1.28s;
  }
  .mid-arrow svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .legend {
    position: absolute;
    left: 42px;
    right: 42px;
    bottom: 42px;
    display: flex;
    justify-content: center;
    gap: 34px;
    flex-wrap: wrap;
    font-size: 12px;
    color: #5e5d58;
  }
  .legend-item {
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 999px;
    display: inline-block;
  }
  .footer {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 14px;
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    font-style: italic;
    font-family: var(--font-ui);
  }
  @keyframes revealGroup {
    0%, 4% {
      opacity: 0;
      transform: translateY(5px);
    }
    12%, 100% {
      opacity: 1;
      transform: translateY(0);
    }
  }
  @keyframes midFade {
    0%, 18% {
      opacity: 0;
      transform: translateY(4px);
    }
    28%, 100% {
      opacity: 1;
      transform: translateY(0);
    }
  }
  @media (max-width: 1180px) {
    body { padding: 0; }
    .slide {
      width: 100vw;
      height: 100vh;
      aspect-ratio: auto;
      border: none;
      box-shadow: none;
    }
    .layout {
      inset: 24px 20px 88px;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr 120px 1fr;
      gap: 8px;
    }
    .mid-arrow {
      transform: rotate(90deg);
    }
    .legend {
      gap: 16px;
      left: 20px;
      right: 20px;
      bottom: 40px;
    }
  }
  @media (max-width: 680px) {
    body {
      padding: 0;
      display: block;
    }
    .slide {
      width: 100vw;
      min-height: 100svh;
      height: auto;
      aspect-ratio: auto;
    }
    .frame {
      inset: 10px;
    }
    .layout {
      inset: 18px 14px 108px;
      grid-template-rows: minmax(240px, auto) 84px minmax(240px, auto);
      gap: 10px;
    }
    .panel {
      padding: 10px 8px 24px;
    }
    .panel-title,
    .mid-copy {
      font-size: 13px;
    }
    .plot-wrap {
      inset: 34px 0 12px;
    }
    .legend {
      left: 12px;
      right: 12px;
      bottom: 28px;
      gap: 10px 14px;
      font-size: 10px;
      justify-content: flex-start;
    }
    .footer {
      bottom: 10px;
      padding: 0 12px;
      font-size: 10px;
      line-height: 1.35;
    }
  }
</style>
</head>

function rawY(value, minValue, maxValue, top, bottom) {
  const lo = Math.log10(minValue);
  const hi = Math.log10(maxValue);
  const t = (Math.log10(value) - lo) / Math.max(1e-9, hi - lo);
  return bottom - t * (bottom - top);
}

function linearY(value, minValue, maxValue, top, bottom) {
  const t = (value - minValue) / Math.max(1e-9, maxValue - minValue);
  return bottom - t * (bottom - top);
}

function xPos(value, left, right) {
  return left + (value / 4.0) * (right - left);
}

const TYPOLOGY_CENTERS = {
  moment_frame: 0.5,
  braced_frame: 1.5,
  core_frame: 2.5,
  shear_wall_frame: 3.5
};

function buildPlot(containerId, mode) {
  const host = document.getElementById(containerId);
  const width = host.clientWidth || 640;
  const height = host.clientHeight || 520;
  const left = 54;
  const right = width - 18;
  const top = 18;
  const bottom = height - 52;
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);

  function line(x1, y1, x2, y2, cls) {
    const el = document.createElementNS(ns, "line");
    el.setAttribute("x1", x1);
    el.setAttribute("y1", y1);
    el.setAttribute("x2", x2);
    el.setAttribute("y2", y2);
    el.setAttribute("class", cls);
    svg.appendChild(el);
  }

  function text(x, y, value, cls, attrs = {}) {
    const el = document.createElementNS(ns, "text");
    el.setAttribute("x", x);
    el.setAttribute("y", y);
    el.setAttribute("class", cls);
    el.textContent = value;
    Object.entries(attrs).forEach(([key, val]) => el.setAttribute(key, val));
    svg.appendChild(el);
  }

  if (mode === "raw") {
    for (const tick of DATA.raw_ticks) {
      const y = rawY(tick, DATA.raw_domain[0], DATA.raw_domain[1], top, bottom);
      line(left, y, right, y, "guide-line");
      text(left - 10, y + 4, tick.toExponential(0).replace("e-0", "e-"), "axis-text", { "text-anchor": "end" });
    }
    text(18, (top + bottom) / 2, "Displacement (mm)", "axis-label", {
      transform: `rotate(-90 18 ${(top + bottom) / 2})`,
      "text-anchor": "middle"
    });
  } else {
    for (const tick of DATA.norm_ticks) {
      const y = linearY(tick, DATA.norm_domain[0], DATA.norm_domain[1], top, bottom);
      line(left, y, right, y, tick === 0 ? "axis-line" : "guide-line");
      text(left - 10, y + 4, String(tick), "axis-text", { "text-anchor": "end" });
    }
    text(18, (top + bottom) / 2, "Standard deviations from typology mean", "axis-label", {
      transform: `rotate(-90 18 ${(top + bottom) / 2})`,
      "text-anchor": "middle"
    });
  }

  line(left, top, left, bottom, "axis-line");
  line(left, bottom, right, bottom, "axis-line");

  DATA.typologies.forEach((typology) => {
    const className = typology.id.replace("_frame", "").replace("shear_wall", "shear");
    const group = document.createElementNS(ns, "g");
    group.setAttribute("class", `group ${mode}-group ${className}`);
    const points = mode === "raw" ? typology.raw : typology.norm;

    points.forEach((point) => {
      const circle = document.createElementNS(ns, "circle");
      const cy = mode === "raw"
        ? rawY(point.y, DATA.raw_domain[0], DATA.raw_domain[1], top, bottom)
        : linearY(point.y, DATA.norm_domain[0], DATA.norm_domain[1], top, bottom);
      circle.setAttribute("class", "dot");
      circle.setAttribute("cx", xPos(point.x, left, right));
      circle.setAttribute("cy", Math.max(top + 2, Math.min(bottom - 2, cy)));
      circle.setAttribute("r", "2.25");
      circle.setAttribute("fill", typology.color);
      group.appendChild(circle);
    });

    svg.appendChild(group);
    text(
      xPos(TYPOLOGY_CENTERS[typology.id], left, right),
      height - 16,
      typology.label,
      "axis-text",
      { "text-anchor": "middle" }
    );
  });

  host.innerHTML = "";
  host.appendChild(svg);
}

function buildLegend() {
  const legend = document.getElementById("legend");
  legend.innerHTML = DATA.typologies.map((typology) => `
    <span class="legend-item">
      <span class="legend-dot" style="background:${typology.color}"></span>
      <span>${typology.label}</span>
    </span>
  `).join("");
}

function render() {
  buildPlot("raw-plot", "raw");
  buildPlot("norm-plot", "norm");
  buildLegend();
}

window.addEventListener("resize", render);
render();
</script>
